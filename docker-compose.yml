version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: relicbourse-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-relic}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-relicsecret}
      POSTGRES_DB: ${POSTGRES_DB:-relicbourse}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - relic_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-relic} -d ${POSTGRES_DB:-relicbourse}"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  relic_pgdata:
    name: relicbourse_pgdata
